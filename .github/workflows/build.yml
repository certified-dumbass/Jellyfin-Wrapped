name: Build and publish Jelly-Wrapped

on:
  push:
    branches: [main]
    paths-ignore:
      - manifest.json
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jelly-wrapped-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Jelly-Wrapped for Jellyfin 12.4
        run: dotnet build standard.csproj --configuration Release
      - name: Validate admin JavaScript
        run: node --check Web/standardcore.js
      - name: Package installable ZIP
        run: |
          set -euo pipefail
          mkdir -p release/staging
          cp bin/Release/net10.0/Wrapped.Core.dll release/staging/
          cp meta.json release/staging/
          cd release/staging
          zip -q -9 ../Jelly-Wrapped-1.16.0.0-Jellyfin12.4.zip Wrapped.Core.dll meta.json
          unzip -l ../Jelly-Wrapped-1.16.0.0-Jellyfin12.4.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Jelly-Wrapped-1.16.0.0-Jellyfin12.4
          path: release/Jelly-Wrapped-1.16.0.0-Jellyfin12.4.zip
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="release/Jelly-Wrapped-1.16.0.0-Jellyfin12.4.zip"
          TAG="v1.16.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --title "Jelly-Wrapped v1.16.0.0 (Jellyfin 12.4)" --notes "Jelly-Wrapped community plugin: per-user eligibility controls and new episode-added / busiest-month slides. Development release; test on a backed-up Jellyfin server."
          fi
      - name: Write Jellyfin plugin repository manifest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib, json

          f=Path('release/Jelly-Wrapped-1.16.0.0-Jellyfin12.4.zip')
          manifest=[{
            'guid':'5f84d6a7-2c91-47b3-a65e-841e9d42f731',
            'name':'Jelly-Wrapped',
            'description':'Cinematic personalized Jellyfin Wrapped slides with user eligibility controls and library additions statistics.',
            'overview':'A customizable Wrapped slideshow builder for Jellyfin 12.4.',
            'owner':'Jelly-Wrapped contributors',
            'category':'General',
            'versions':[{
              'version':'1.16.0.0',
              'changelog':'Public rebrand, per-user exclusion controls, episode library-additions counter, busiest uploads month, new branding.',
              'targetAbi':'12.4.0.0',
              'sourceUrl':'https://github.com/certified-dumbass/Jellyfin-Wrapped/releases/download/v1.16.0.0/Jelly-Wrapped-1.16.0.0-Jellyfin12.4.zip',
              'checksum':hashlib.md5(f.read_bytes()).hexdigest(),
              'timestamp':datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')
            }]
          }]
          Path('manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit generated manifest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Jelly-Wrapped plugin manifest [skip ci]'
            git push origin HEAD:main
          fi
